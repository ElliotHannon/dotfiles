# ==============================================================================
# KITTY CONFIGURATION 
# ==============================================================================

# --- FONTS ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# --- WINDOW LAYOUT ---
window_padding_width    14
background_opacity      0.88
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size     yes
initial_window_width     1020
initial_window_height    680

# --- CURSOR (Glowing Cyan Pill) ---
cursor                  #00f5d4
cursor_text_color       #0d0914
cursor_shape            block
shell_integration       no-cursor
cursor_blink_interval   0.4

# --- GENERAL BEHAVIOR ---
scrollback_lines        10000
enable_audio_bell       no
visual_bell_duration    0.0
term                    xterm-kitty

# --- TAB BAR (Powerline Neon Badges) ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{fmt.fg.tab}   {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# --- COLOR PALETTE (Extravagant Neon Void) ---
background              #0d0914
foreground              #f1f5f9
selection_background    #ff007f
selection_foreground    #ffffff
url_color               #00f5d4

# Tab Colors
active_tab_background   #d946ef
active_tab_foreground   #0d0914
inactive_tab_background #1f1435
inactive_tab_foreground #8b5cf6
tab_bar_background      #08050e

# 16 ANSI Colors
# Black / Gray
color0  #18122b
color8  #4a3e6d

# Hot Pink / Neon Red
color1  #ff2a6d
color9  #ff5f87

# Electric Lime / Emerald
color2  #00ff9f
color10 #00f5d4

# Cyber Gold / Amber
color3  #ffe600
color11 #fde047

# Neon Cyan / Electric Blue
color4  #05d9e8
color12 #38bdf8

# Vivid Purple / Hot Magenta
color5  #d946ef
color13 #f0abfc

# Electric Violet
color6  #a855f7
color14 #c084fc

# White / Soft Slate
color7  #e2e8f0
color15 #ffffff

# --- KEYBINDINGS ---
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+tab            next_tab
map ctrl+shift+tab      previous_tab
